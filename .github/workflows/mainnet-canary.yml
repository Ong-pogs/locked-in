name: Mainnet Read-Only Canary

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: 'Optional full commit SHA the frontend must serve (empty skips the commit check)'
        required: false
        default: ''
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: mainnet-read-only-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Production web and API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Scheduled runs do not pin a commit: github.sha is the latest master,
      # which Vercel may still be building, so pinning it raised false alarms.
      # A manual run can pass expected_revision to check a specific deploy.
      - name: Run GET-only production canary
        env:
          LOCKED_IN_EXPECTED_REVISION: ${{ github.event.inputs.expected_revision }}
        run: >-
          node scripts/live-mainnet-canary.mjs
          --timeout 45000
