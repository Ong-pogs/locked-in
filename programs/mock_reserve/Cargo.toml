[package]
name = "mock-reserve"
version = "0.1.0"
description = "Devnet-only mock of Kamino klend: same deposit/redeem CPI interface, deterministic yield. NEVER deploy to mainnet."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_reserve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["associated_token"] }
