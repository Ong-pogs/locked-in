# Render Blueprint for scheduled infrastructure.
# Apply this in Render as a Blueprint to create the daily leaderboard refresh
# cron job. Existing dashboard-managed web services are not defined here.
services:
  - type: cron
    name: locked-in-leaderboard-snapshot-refresh
    runtime: node
    rootDir: backend
    schedule: "0 0 * * *"
    buildCommand: npm ci
    startCommand: npm run cron:leaderboard-refresh
    envVars:
      - key: SCHEDULER_SECRET
        sync: false
      - key: LEADERBOARD_REFRESH_BASE_URL
        sync: false
      - key: LEADERBOARD_SNAPSHOT_PAGE_SIZE
        value: "25"

  # Community-pot cycle. Runs DAILY at 03:00 UTC but only ever targets the
  # previous (fully elapsed) UTC month — so it distributes once shortly after
  # month-end and every later run that month is a benign no-op (ALREADY_CLOSED /
  # NOTHING_TO_DISTRIBUTE). Daily cadence gives automatic retry if the first
  # post-month run hits a transient RPC/DB error, instead of waiting a month
  # (audit M16). Idempotent + advisory-locked.
  - type: cron
    name: locked-in-pot-cycle
    runtime: node
    rootDir: backend
    schedule: "0 3 * * *"
    buildCommand: npm ci
    startCommand: npm run cron:pot-cycle
    envVars:
      - key: SCHEDULER_SECRET
        sync: false
      - key: POT_CYCLE_BASE_URL
        sync: false

  # Daily shield/lapse sweep (sweep ruling R16). The sweep is the ONLY miss
  # judge (legacy engine retired, R19) — without this cron an idle user's
  # flame/shield/lapse state freezes until their next lesson submit. Runs at
  # 00:30 UTC judging the fully-elapsed previous UTC day; idempotent
  # (day-keyed receipts), so a retry or a duplicate run is a no-op.
  - type: cron
    name: locked-in-lapse-sweep
    runtime: node
    rootDir: backend
    schedule: "30 0 * * *"
    buildCommand: npm ci
    startCommand: npm run cron:lapse-sweep
    envVars:
      - key: SCHEDULER_SECRET
        sync: false
      - key: LAPSE_SWEEP_BASE_URL
        sync: false

  # Arena expiry sweep. Async 1v1 matches have a 24h window; without this cron
  # an abandoned match never settles and both players' ladder rows stay stuck.
  # Runs every 15 minutes because the window closes continuously rather than on
  # a daily boundary. Idempotent + advisory-locked, so overlapping runs and
  # retries are no-ops.
  - type: cron
    name: locked-in-arena-sweep
    runtime: node
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: npm ci
    startCommand: npm run cron:arena-sweep
    envVars:
      - key: SCHEDULER_SECRET
        sync: false
      - key: ARENA_SWEEP_BASE_URL
        sync: false

  # Arena stake seasons: closes an expired season, settles each entry, opens the
  # next. Daily rather than every 15 minutes because a season boundary is a UTC
  # day boundary, and at 00:35 UTC so the day has fully closed before this reads
  # it (same reasoning as the lapse sweep). Advisory-locked on its own key, and
  # each entry settles in its own transaction, so a retry is a no-op and an
  # entry whose chain read fails simply stays PENDING for the next run.
  #
  # BOTH env vars below must be set on the service. They are sync:false, which
  # means Render creates them EMPTY — the arena-sweep cron above failed every 15
  # minutes on exactly this until SCHEDULER_SECRET was filled in by hand. Set
  # them before the first scheduled run and confirm the log reads
  # "[arena-season] opened=..." rather than "SCHEDULER_SECRET is required".
  - type: cron
    name: locked-in-arena-season
    runtime: node
    rootDir: backend
    schedule: "35 0 * * *"
    buildCommand: npm ci
    startCommand: npm run cron:arena-season
    envVars:
      - key: SCHEDULER_SECRET
        sync: false
      - key: ARENA_SWEEP_BASE_URL
        sync: false
