# Render Blueprint for scheduled infrastructure.
# Apply this in Render as a Blueprint to create the daily leaderboard refresh
# cron job. Existing dashboard-managed web services are not defined here.
services:
  - type: cron
    name: locked-in-leaderboard-snapshot-refresh
    runtime: node
    rootDir: backend
    schedule: "0 0 * * *"
    buildCommand: npm ci
    startCommand: npm run cron:leaderboard-refresh
    envVars:
      - key: SCHEDULER_SECRET
        sync: false
      - key: LEADERBOARD_REFRESH_BASE_URL
        sync: false
      - key: LEADERBOARD_SNAPSHOT_PAGE_SIZE
        value: "25"

  # Community-pot cycle. Runs DAILY at 03:00 UTC but only ever targets the
  # previous (fully elapsed) UTC month — so it distributes once shortly after
  # month-end and every later run that month is a benign no-op (ALREADY_CLOSED /
  # NOTHING_TO_DISTRIBUTE). Daily cadence gives automatic retry if the first
  # post-month run hits a transient RPC/DB error, instead of waiting a month
  # (audit M16). Idempotent + advisory-locked.
  - type: cron
    name: locked-in-pot-cycle
    runtime: node
    rootDir: backend
    schedule: "0 3 * * *"
    buildCommand: npm ci
    startCommand: npm run cron:pot-cycle
    envVars:
      - key: SCHEDULER_SECRET
        sync: false
      - key: POT_CYCLE_BASE_URL
        sync: false
